<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Resume Analyzer</title>
    <style>
        :root {
            --bg: #eceff1;
            --panel: #f7f8fa;
            --ink: #143035;
            --muted: #4d666d;
            --line: #d7dde2;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--ink);
        }

        .container {
            width: min(720px, calc(100% - 24px));
            margin: 18px auto 30px;
        }

        .top {
            background: linear-gradient(115deg, #0c766f, #1f4fb7);
            border-radius: 20px;
            color: #f4fbff;
            padding: 18px;
            box-shadow: 0 10px 26px rgba(11, 64, 89, 0.2);
        }

        .top-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            border-radius: 10px;
            background: rgba(245, 250, 255, 0.22);
            color: #fff;
            padding: 9px 14px;
            font-weight: 700;
            font-size: 12px;
            text-decoration: none;
            cursor: pointer;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 16px;
            margin-top: 12px;
        }

        h1, h2 {
            margin: 0;
        }

        .sub {
            color: #dcecf6;
            font-size: 13px;
            margin: 6px 0 0;
        }

        .panel-sub {
            color: var(--muted);
            font-size: 12px;
            margin-top: 6px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-top: 12px;
            margin-bottom: 5px;
            color: #2a4950;
        }

        input {
            width: 100%;
            border: 1px solid #ccd6dc;
            border-radius: 10px;
            padding: 12px;
            font-size: 13px;
            background: #fff;
        }

        .primary {
            margin-top: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(120deg, #0f8679, #1d4dc8);
            color: #fff;
            padding: 10px 14px;
            font-weight: 800;
            cursor: pointer;
        }

        .alert {
            margin-top: 10px;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 12px;
        }

        .alert.error {
            background: #fce7e8;
            color: #9f1d24;
            border: 1px solid #f8c7cb;
        }

        .alert.success {
            background: #e8fbf4;
            color: #0f7a5f;
            border: 1px solid #c9f0e1;
        }
    </style>
</head>
<body>
<div class="container">
    <section class="top">
        <h1>Reset Password</h1>
        <p class="sub">Update your password without changing any other account or dashboard settings.</p>
        <div class="top-actions">
            <a class="btn" th:href="@{/dashboard}">Dashboard</a>
            <a class="btn" th:href="@{/profile}">Edit Profile</a>
            <a class="btn" th:href="@{/logout}">Logout</a>
        </div>
    </section>

    <section class="panel">
        <h2>Password Settings</h2>
        <p class="panel-sub">Enter your current password and choose a new one.</p>

        <div class="alert error" th:if="${error}" th:text="${error}"></div>
        <div class="alert success" th:if="${success}" th:text="${success}"></div>

        <form th:action="@{/reset-password}" method="post">
            <label for="currentPassword">Current Password</label>
            <input id="currentPassword" type="password" name="currentPassword" required>

            <label for="newPassword">New Password</label>
            <input id="newPassword" type="password" name="newPassword" required>

            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" type="password" name="confirmPassword" required>

            <button class="primary" type="submit">Save New Password</button>
        </form>
    </section>
</div>
</body>
</html>
