<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Resume Analyzer</title>
    <style>
        :root {
            --bg-start: #f5efe6;
            --bg-end: #dce8f2;
            --card: rgba(255, 255, 255, 0.88);
            --text: #1f2937;
            --muted: #6b7280;
            --accent: #0f766e;
            --accent-dark: #115e59;
            --danger: #b91c1c;
            --success: #166534;
            --border: rgba(15, 118, 110, 0.14);
            --shadow: 0 24px 60px rgba(31, 41, 55, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background:
                    radial-gradient(circle at top left, rgba(15, 118, 110, 0.18), transparent 28%),
                    radial-gradient(circle at bottom right, rgba(37, 99, 235, 0.16), transparent 32%),
                    linear-gradient(135deg, var(--bg-start), var(--bg-end));
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: min(520px, 100%);
            background: var(--card);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 28px;
            padding: 36px;
            box-shadow: var(--shadow);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 2.2rem;
        }

        .subtext {
            margin: 0 0 24px;
            color: var(--muted);
            line-height: 1.6;
        }

        .alert {
            padding: 12px 14px;
            border-radius: 14px;
            margin-bottom: 16px;
            font-size: 0.95rem;
        }

        .alert.error {
            background: rgba(185, 28, 28, 0.08);
            color: var(--danger);
        }

        .alert.success {
            background: rgba(22, 101, 52, 0.08);
            color: var(--success);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 18px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.95);
            font-size: 1rem;
            outline: none;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 14px;
            padding: 15px 18px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        .footer-link {
            margin-top: 18px;
            text-align: center;
            color: var(--muted);
        }

        .footer-link a {
            color: var(--accent-dark);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Reset forgotten password</h1>
    <p class="subtext">Enter your registered email address and choose a new password.</p>

    <div class="alert error" th:if="${error}" th:text="${error}"></div>
    <div class="alert success" th:if="${success}" th:text="${success}"></div>

    <form th:action="@{/forgot-password}" method="post">
        <label for="email">Email Address</label>
        <input id="email" type="email" name="email" placeholder="name@example.com" th:value="${email}" required>

        <label for="newPassword">New Password</label>
        <input id="newPassword" type="password" name="newPassword" placeholder="Enter your new password" required>

        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" type="password" name="confirmPassword" placeholder="Confirm your new password" required>

        <button type="submit">Reset Password</button>
    </form>

    <p class="footer-link">
        <a th:href="@{/login}">Back to login</a>
    </p>
</div>
</body>
</html>
